<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marwa</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%}
#name{position:fixed;left:50%;transform:translate(-50%,-50%);margin:0;font-family:'Great Vibes','Brush Script MT',cursive;font-weight:400;color:#ffe3ea;text-shadow:0 0 18px #ff4d7a,0 0 42px #ff2d6a;opacity:0;transition:opacity 3s ease;white-space:nowrap;pointer-events:none}
#name.on{opacity:1;animation:glow 3.5s ease-in-out infinite alternate}
@keyframes glow{from{text-shadow:0 0 12px #ff4d7a,0 0 30px #ff2d6a}to{text-shadow:0 0 22px #ff7a9c,0 0 56px #ff2d6a}}
#msg{position:fixed;left:0;right:0;text-align:center;padding:0 6vw;box-sizing:border-box;font-family:'Amiri','Traditional Arabic',serif;color:#ffd9e2;pointer-events:none}
#msg .orn{display:block;color:#e8a6b8;opacity:0;transition:opacity 2.5s ease;letter-spacing:.5em;font-size:18px}
#msg .line{height:1px;width:min(70vw,320px);margin:6px auto;background:linear-gradient(90deg,transparent,#e8a6b8,transparent);opacity:0;transition:opacity 2.5s ease}
#msg p{margin:8px 0;font-size:clamp(20px,5.4vw,30px);line-height:2;font-weight:700;text-shadow:0 0 14px rgba(255,77,122,.45)}
#msg p span{opacity:0;display:inline-block;transform:translateY(8px);transition:opacity 1.6s ease,transform 1.6s ease}
#msg.on .orn,#msg.on .line{opacity:1}
#msg.on p span{opacity:1;transform:none}
#start{position:fixed;inset:0;z-index:5;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;cursor:pointer;transition:opacity 1s ease;-webkit-tap-highlight-color:transparent}
#start.off{opacity:0;pointer-events:none}
#start b{font:italic 400 12px Georgia,serif;color:#ffc2d1;opacity:.8;animation:bl 2.4s ease-in-out infinite alternate}
#start i{font:400 15px 'Amiri',serif;color:#9b6676;font-style:normal}
@keyframes bl{from{opacity:.25}to{opacity:.9}}
#snd{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 12px);left:14px;background:none;border:0;color:#e8a6b8;font-size:22px;opacity:0;transition:opacity 2s ease;cursor:pointer;padding:6px}
#snd.on{opacity:.7}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="start"><b>I Love You</b><i>المس الشاشة ♡</i></div>
<button id="snd" aria-label="music">♪</button>
<h1 id="name">Marwa</h1>
<div id="msg">
  <span class="orn">❁ ❀ ❁</span>
  <div class="line"></div>
  <p id="txt"></p>
  <div class="line"></div>
  <span class="orn">❁ ❀ ❁</span>
</div>
<script>
(function(){
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),nameEl=document.getElementById('name'),msg=document.getElementById('msg');
var W,H,DPR,P=[],S,CX,CY,t0=performance.now();
var words=['أشكرك','على','كل','لحظة','كنتِ','بجواري،','وستكونين','فيها','بجواري،','يا','أجمل','وردة…','أحبك'];
var txt=document.getElementById('txt');
words.forEach(function(w,i){var s=document.createElement('span');s.textContent=w;s.style.transitionDelay=(i*0.35)+'s';txt.appendChild(s);txt.appendChild(document.createTextNode(' '));});
function hx(t){return 16*Math.pow(Math.sin(t),3)}
function hy(t){return 13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)}
function build(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  S=Math.min(W*0.88/32,H*0.5/30);
  CX=W/2;CY=H*0.4;
  var oy=CY-(-2)*(-1)*S; // placeholder
  oy=CY+(-2)*S*-1; // origin so bbox center (param y=-2) sits at CY
  oy=CY-2*S;
  P=[];
  var layers=[1,.82,.64,.46];
  layers.forEach(function(L,li){
    var n=Math.round(95*L*(W<500?0.8:1.1));
    for(var i=0;i<n;i++){
      var t=i/n*Math.PI*2+(li%2)*0.05;
      var x=CX+hx(t)*S*L, y=oy-hy(t)*S*L;
      if(L<.7&&Math.abs(x-CX)<S*7.2&&Math.abs(y-CY)<S*3.2)continue;
      var a=Math.random()*Math.PI*2,r=Math.max(W,H)*(0.35+Math.random()*0.5);
      P.push({x:x,y:y,sx:CX+Math.cos(a)*r,sy:CY+Math.sin(a)*r,
        d:1.8+li*0.7+Math.random()*2.6,
        f:Math.max(8,Math.min(13,S*0.42))*(0.85+Math.random()*0.35),
        c:'hsl('+(335+Math.random()*20)+',85%,'+(68+Math.random()*18)+'%)',
        tw:Math.random()*6.28});
    }
  });
  nameEl.style.fontSize=Math.max(40,S*5.6)+'px';
  nameEl.style.top=CY+'px';
  msg.style.top=(CY+15.5*S+8)+'px';
}
function ease(t){return 1-Math.pow(1-t,3)}
function frame(now){
  var T=(now-t0)/1000;
  ctx.clearRect(0,0,W,H);
  ctx.textAlign='center';ctx.textBaseline='middle';
  // opening: a single tiny phrase
  var a0=Math.min(1,T/1.2)*(1-Math.min(1,Math.max(0,(T-2.2)/1.5)));
  if(a0>0){ctx.globalAlpha=a0*0.9;ctx.fillStyle='#ffc2d1';ctx.font='italic 12px Georgia,serif';ctx.fillText('I Love You',CX,CY);}
  var beat=T>7?1+0.012*Math.sin((T-7)*2.2):1;
  for(var i=0;i<P.length;i++){
    var p=P[i],k=Math.min(1,Math.max(0,(T-p.d)/3));
    if(k<=0)continue;
    var e=ease(k);
    var x=p.sx+(p.x-p.sx)*e,y=p.sy+(p.y-p.sy)*e;
    x=CX+(x-CX)*beat;y=CY+(y-CY)*beat;
    ctx.globalAlpha=Math.min(1,k*1.4)*(0.55+0.35*Math.sin(T*1.5+p.tw));
    ctx.fillStyle=p.c;
    ctx.font='italic '+p.f+'px Georgia,serif';
    ctx.fillText('I Love You',x,y);
  }
  ctx.globalAlpha=1;
  requestAnimationFrame(frame);
}
var ac=null,master=null,muted=false;
function music(){
  var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{
  ac=new AC();if(ac.state==='suspended')ac.resume();
  master=ac.createGain();master.gain.setValueAtTime(0.0001,ac.currentTime);master.gain.linearRampToValueAtTime(0.55,ac.currentTime+5);
  var lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2000;
  var dl=ac.createDelay(1);dl.delayTime.value=0.45;
  var fb=ac.createGain();fb.gain.value=0.4;
  var wet=ac.createGain();wet.gain.value=0.38;
  lp.connect(master);lp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(master);master.connect(ac.destination);
  var fq=function(m){return 440*Math.pow(2,(m-69)/12)};
  var note=function(m,t,d,v,type){
    var o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.value=fq(m);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.03);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(lp);o.start(t);o.stop(t+d+0.05);
  };
  var pad=function(m,t,d,v){
    var o=ac.createOscillator(),g=ac.createGain();
    o.type='sine';o.frequency.value=fq(m);
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+1.2);g.gain.linearRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(lp);o.start(t);o.stop(t+d+0.05);
  };
  var chords=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]];
  var bass=[45,41,36,43];
  var pat=[0,1,2,3,2,1,2,1];
  var bar=3.6,step=bar/8,next=ac.currentTime+0.3,n=0;
  var sched=function(){
    while(next<ac.currentTime+2){
      var c=chords[n%4],arp=[c[0]+12,c[1]+12,c[2]+12,c[0]+24];
      c.forEach(function(m){pad(m,next,bar+1.2,0.045)});
      note(bass[n%4],next,bar,0.14,'sine');
      for(var i=0;i<8;i++){note(arp[pat[i]],next+i*step,1.6,i===0?0.16:0.1,'triangle')}
      if(n%2===0){note(c[2]+24,next+step*2,2.6,0.07,'sine')}
      next+=bar;n++;
    }
  };
  sched();setInterval(sched,800);
  }catch(e){}
}
document.addEventListener('visibilitychange',function(){
  if(!ac)return;
  if(document.hidden){ac.suspend()}else if(!muted){ac.resume()}
});
var snd=document.getElementById('snd');
snd.addEventListener('click',function(){
  if(!ac)return;
  muted=!muted;
  master.gain.cancelScheduledValues(ac.currentTime);
  master.gain.setTargetAtTime(muted?0.0001:0.55,ac.currentTime,0.3);
  snd.textContent=muted?'✕':'♪';
});
build();
window.addEventListener('resize',build);
var st=document.getElementById('start'),started=false;
function go(){
  if(started)return;started=true;
  st.classList.add('off');
  music();
  t0=performance.now();
  requestAnimationFrame(frame);
  snd.classList.add('on');
  setTimeout(function(){nameEl.classList.add('on')},6500);
  setTimeout(function(){msg.classList.add('on')},9000);
}
st.addEventListener('click',go);
st.addEventListener('touchend',function(e){e.preventDefault();go()},{passive:false});
})();
</script>
</body>
</html>
